<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Ιδιωτικός πίνακας παραγγελιών προσωπικού More Than a Kiosk.">
  <link rel="canonical" href="https://morethanakiosk.com/staff.html">
  <title>Παραγγελίες προσωπικού | More Than a Kiosk</title>
  <link rel="icon" href="assets/icons/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/staff.css">
</head>
<body class="staff-page">
  <noscript><nav class="noscript-nav" aria-label="Βασική πλοήγηση"><a href="index.html">Αρχική</a><a href="menu.html">Κατάλογος</a></nav></noscript>
  <main class="staff-shell">
    <header class="staff-brand">
      <img src="assets/images/brand/more-than-kiosk-logo.webp" alt="More Than a Kiosk" width="1000" height="1000">
      <div><small>More Than a Kiosk</small><h1>Παραγγελίες τραπεζιών</h1></div>
      <button data-sign-out hidden type="button">Αποσύνδεση</button>
    </header>

    <section class="staff-login" data-login-panel>
      <h2>Σύνδεση προσωπικού</h2>
      <p>Χρησιμοποίησε τον λογαριασμό προσωπικού που έχει εγκριθεί από τον διαχειριστή.</p>
      <form data-login-form>
        <label>Email<input data-login-email type="email" autocomplete="username" required></label>
        <label>Κωδικός<input data-login-password type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">Σύνδεση</button>
      </form>
    </section>

    <section data-staff-app hidden>
      <div class="staff-toolbar">
        <div><span class="staff-live-dot"></span><strong>Ζωντανές παραγγελίες</strong><small data-last-update></small></div>
        <button data-refresh type="button">Ανανέωση</button>
      </div>
      <nav class="staff-tabs" aria-label="Προβολές">
        <button class="active" data-staff-tab="orders" type="button">Παραγγελίες <span data-new-count>0</span></button>
        <button data-staff-tab="tables" type="button">Τραπέζια</button>
      </nav>
      <div data-orders-view><div class="staff-orders" data-orders></div></div>
      <div data-tables-view hidden><div class="staff-tables" data-tables></div></div>
    </section>
    <p class="staff-message" data-staff-message role="status" aria-live="polite"></p>
  </main>
  <audio data-new-order-sound preload="auto"><source src="data:audio/wav;base64,UklGRkQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSAAAAAA////AAAA////AAAA////AAAA////" type="audio/wav"></audio>
  <script src="js/supabase-config.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
